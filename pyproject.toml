[project]
name = "realization_counting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Martin Beneš", email = "benesm44@fit.cvut.cz" }]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "httpx>=0.28.1",
    "marimo>=0.24.2",
    "polars>=1.44.2",
    "pynauty>=2.8.8.1",
    "pyrigi>=1.3.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
pyrigi = { git = "https://github.com/bonimart/PyRigi", branch = "dev" }

[dependency-groups]
dev = ["prek>=0.5.4", "pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
